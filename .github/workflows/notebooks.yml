name: Tutorial Notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — pushing N commits in a row
# shouldn't keep N CI runs going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: ${{ matrix.notebook }}
    runs-on: ubuntu-22.04
    # Per-notebook budget. Previously 30 min covered all 14 notebooks run
    # serially, which the heavy PEX/LVS notebooks could not fit into; when the
    # job cap fired mid-loop, summary.json/junit.xml were never written and
    # every notebook reported as timed out.
    #
    # Keep this comfortably ABOVE the runner's --notebook-timeout (20 min)
    # plus setup (~3-5 min for container pull + cache restore), so the
    # runner's own timeout fires first and junit.xml is still written. If the
    # job cap fires instead, the report is lost and every leg looks the same.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # One job per notebook so the suite finishes in the time of the slowest
        # notebook, not the sum. part2 notebooks import helper modules written
        # by their part1, so those run as a pair (the runner sorts part1 first).
        notebook:
          - GLayout_Introduction
          - GLayout_Via
          - GLayout_Cmirror
          - GLayout_Cells
          - glayout_opamp
          - glayout_tutorial_FVF_part1
          - glayout_tutorial_INV_part1
          - glayout_tutorial_5T_OTA_part1
          - test_bjt_glayout
          - test_bjt_gdsfactory
          - test_bjt_custom_pattern
          - glayout_tutorial_FVF_part1,glayout_tutorial_FVF_part2
          - glayout_tutorial_INV_part1,glayout_tutorial_INV_part2
          - glayout_tutorial_5T_OTA_part1,glayout_tutorial_5T_OTA_part2
        # Backend per notebook. Default (unset -> gdsfactory) for the eleven
        # tutorials that import Component/rectangle/cell straight from
        # gdsfactory. GLayout_Cells and glayout_opamp only call glayout
        # functions, so they can use the fast native backend — and they must:
        # their large-opamp cell (rmult=2, 3 mimcap rows) runs for well over
        # 20 min on gdsfactory (measured 14 s on gdstk).
        include:
          - notebook: GLayout_Cells
            backend: gdstk
          - notebook: glayout_opamp
            backend: gdstk

    # Same container + Python setup as drc.yml, so the two workflows can
    # share a venv cache. iic-osic-tools ships klayout, magic, netgen, both
    # PDKs (under /foss/pdks), but Python 3.12 + gdsfactory 9.x — we install
    # CPython 3.10 via uv and let glayout's pinned gdsfactory 7.7 / numpy 1.x
    # come along.
    container:
      image: hpretl/iic-osic-tools:latest
      options: --user root
      env:
        # Both sky130A and gf180mcuD live here; glayout's gf180 module reads
        # this at import time even when a notebook only touches sky130, so
        # it has to be set globally.
        # Chosen per matrix leg (see strategy.matrix.include). Mixing a
        # gdstk-backed nmos() into a gdsfactory Component fails add_ref's
        # isinstance check ("needs to be a Component"), so only notebooks with
        # no direct gdsfactory imports may use gdstk.
        GLAYOUT_BACKEND: ${{ matrix.backend || 'gdsfactory' }}
        # Tells the PEX cells in the FVF/INV/BJT tutorials to skip magic's
        # `extresist` pass (full RC extraction), which runs for minutes on a
        # flattened design. Devices + caps are still extracted.
        GLAYOUT_SKIP_EXTRESIST: "1"
        PDK_ROOT: /foss/pdks
        # FVF / INV / BJT tutorials default to gf180; the bootstrap cell in
        # each notebook derives PDKPATH from PDK_ROOT/PDK if unset.
        PDK: gf180mcuD
        PDKPATH: /foss/pdks/gf180mcuD
        DEBIAN_FRONTEND: noninteractive
        PYTHONUNBUFFERED: "1"
        # The image sets PYTHONPATH to its 3.12 site-packages, which would
        # leak gdsfactory 9.x into the 3.10 kernel.
        PYTHONPATH: ""
        # GitHub Actions overrides the image's ENTRYPOINT with `tail -f`,
        # so the iic-osic-tools entrypoint that normally enriches PATH with
        # /foss/tools/{bin,klayout,...} never runs.
        PATH: /foss/tools/bin:/foss/tools/sak:/foss/tools/kactus2:/foss/tools/klayout:/foss/tools/osic-multitool:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    # iic-osic-tools' default container shell is dash, which doesn't grok
    # the bash features uv's installer and our notebooks rely on.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Check that notebook outputs are cleared
        # Fail fast (sub-second, stdlib-only) before the multi-minute
        # nbconvert pass. Catches PRs that ship notebooks with stale outputs
        # — those bloat the diff and defeat the cleared-outputs convention
        # the repo settled on in PR #89.
        run: python3 tests/notebooks/check_outputs_cleared.py

      - name: Cache uv + CPython 3.10
        id: cache-uv
        uses: actions/cache@v4
        with:
          # HOME=/headless in the image even when running as root.
          path: |
            /headless/.local/bin/uv
            /headless/.local/bin/uvx
            /headless/.local/share/uv
          key: uv-py310-${{ runner.os }}-v1

      - name: Install Python 3.10 (uv)
        run: |
          set -euxo pipefail
          if [ ! -x "$HOME/.local/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv python install 3.10
          echo "PYTHON310=$(uv python find 3.10)" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          set -euxo pipefail
          klayout -v
          magic -d null -noconsole -T minimum </dev/null 2>&1 | head -5 || true
          netgen -batch lvs -version 2>&1 | head -3 || true
          ngspice -v 2>&1 | head -3 || true
          "$PYTHON310" --version
          ls "$PDK_ROOT"

      - name: Cache python venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.venv
          # Bust the cache on dependency-relevant changes. notebooks adds
          # jupyter/nbconvert/ipykernel/ipywidgets/gdstk/svgutils on top of
          # the DRC venv, so a separate cache key avoids touching the
          # drc-venv cache.
          key: notebooks-venv-py310-${{ runner.os }}-${{ hashFiles('setup.py', 'src/glayout/**/*.py') }}-v1
          restore-keys: |
            notebooks-venv-py310-${{ runner.os }}-

      - name: Create venv and install glayout + jupyter (cache miss)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/.venv"
          "$PYTHON310" -m venv "$GITHUB_WORKSPACE/.venv"
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          # uv pip install is ~3-5x faster than pip and auto-detects
          # $VIRTUAL_ENV after `activate`. glayout's install_requires already
          # pulls in gdstk / svgutils / ipywidgets; jupyter+nbconvert+
          # ipykernel are the only extras the notebook harness needs.
          uv pip install -e .
          uv pip install jupyter nbconvert ipykernel

      - name: Run tutorial notebook(s)
        run: |
          set -euxo pipefail
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python tests/notebooks/run_tutorial_notebooks.py \
            --only "${{ matrix.notebook }}" \
            --cell-timeout 600 --notebook-timeout 1200 \
            --out-dir notebook_results

      - name: Artifact name
        if: always()
        id: art
        # Matrix entries may contain commas; artifact names cannot.
        run: echo "name=tutorial-nb-$(echo '${{ matrix.notebook }}' | tr ',' '+')" >> "$GITHUB_OUTPUT"

      - name: Upload notebook artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          # Includes executed/*.ipynb, logs/*.log, summary.json, junit.xml —
          # everything needed to triage a regression without rerunning CI.
          path: notebook_results
          retention-days: 14

  publish:
    name: Publish JUnit summary
    runs-on: ubuntu-22.04
    needs: notebooks
    if: always()
    permissions:
      contents: read
      checks: write
    steps:
      - name: Download all notebook artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tutorial-nb-*
          path: all_results

      - name: Publish JUnit summary
        # Skip when no junit.xml was produced (a runner died before write).
        if: ${{ hashFiles('all_results/**/junit.xml') != '' }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: all_results/**/junit.xml
          check_name: Tutorial notebooks
          require_tests: true
